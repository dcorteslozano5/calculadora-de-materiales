<!DOCTYPE html>

<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scalable=1.0, minimum-scalable=1.0">
    <meta http-equiv="X-UA-compatible" content="IE-edge">
    <title>viga - Calculadora de Materiales</title>
    <meta name="description" content="Calcular todo tipo de materiales">
    <meta name="author" content="JHON ANDERSON MANTILLA">
    <link rel="shortcut icon" href="google.png.svg">
    <link rel="stylesheet" href="style.css">
    <script src="calculadora.js" defer></script>

</head>

<body>
    <img class="logo" src="imagenvigaormigon.png" alt="Materiales">
    <main class="calc-container" id="vista-formulario">
        <h1> Calcular viga</h1>

        <form id="form-viga">
            <div class="input-group">
                <label for="largo">Largo de la Viga (m)</label>
                <input type="number" id="largo" name="largo" placeholder="Ej: 5" step="0.01" required>
            </div>
            <button type="submit" class="btn-calcular">Calcular</button>
        </form>
    </main>

    <div class="calc-container" id="vista-resultado" style="display:none ;">
        <h1>Resulado</h1>
        <h2 id="resultado-titulo">viga de 5 m</h2>

        <div class="resultado-grid">
            <div class="resultado-card">
                <span class="resultado-label">Piedra m²</span>
                <span class="resultado-valor" id="valor-piedra">--</span>
            </div>
            <div class="resultado-card">
                <span class="resultado-label">Cemento</span>
                <span class="resultado-valor" id="valor-cemento">--</span>
            </div>
            <div class="resultado-card">
                <span class="resultado-label">Arena</span>
                <span class="resultado-valor" id="valor-arena">--</span>
            </div>
            <div class="resultado-card">
                <span class="resultado-label">Hierro de 8</span>
                <span class="resultado-valor" id="valor-hierro8">--</span>
            </div>
            <div class="resultado-card">
                <span class="resultado-label">Hierro de 4</span>
                <span class="resultado-valor" id="valor-hierro4">--</span>
            </div>

        </div>
        <button class="btn-volver" onclick="window.location.href='menu.html'">Volver al menu</button>
    </div>
</body>

</html>
