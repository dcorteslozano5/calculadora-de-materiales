<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scalable=1.0, minimum-scalable=1.0">
    <meta http-equiv="X-UA-compatible" content="IE-edge">
    <title>Recuperar contraseña? - Calculadora de Materiales</title>
    <meta name="description" content="Calcular todo tipo de material">
    <meta name="author" content="JHON ANDERSON MANTILLA">
    <link rel="shortcut icon" href="google.png.svg">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <img class="logo" src="logo.png" alt="Materiales">
    <header>
        <h1>Recuperar contraseña?</h1>

        <form id="form-recuperar">
            <input type="text" name="nombre" placeholder="Nombre completo" required>
            <input type="email" name="correo" placeholder="Correo" required>
            <input type="email" name="Confirmar correo" placeholder="Confirmar correo" required>
            <button type="submit" class="btn-primary">Recuperar Contraseña</button>
        </form>

        <p>¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a></p>
    </header>

    <script>
        document.getElementById('form-recuperar').addEventListener('submit', function (e) {
            e.preventDefault();

            if (nombre && correo) {
                alert("Se encio un enlace de recuperacion a tu correo");
                window.location.href = ("login.html");
            } else {
                alert("Completa todos los campos")
            }
        });
    </script>

</body>

</html>
