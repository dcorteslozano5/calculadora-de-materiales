<!DOCTYPE html>

<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, user-scalable=1.0, initial-scale=1.0, maximum-scalable=1.0, minimum-scalable=1.0">
    <meta http-equiv="X-UA-compatible" content="IE-edge">
    <title>piso - Calculadora de Materiales</title>
    <meta name="description" content="Calcular todo tipo de material">
    <meta name="author" content="JHON ANDERSON MANTILLA">
    <link rel="shortcut icon" href="google.png.svg">
    <link rel="stylesheet" href="style.css">
    <script src="calculadora.js" defer></script>
</head>

<body>
    <img class="logo" src="logo.png" alt="Manteriales">
    <main class="calc-container" id="vista-formulario">
        <h1>Calcular piso</h1>

        <form id="form-piso">
            <div class="input-group">
                <label for="largo">Largo del paño(m)</label>
                <input type="number" id="largo" name="largo" placeholder="Ej: 5" step="0.01" required>
            </div>

            <div class="input-group">
                <label for="ancho">Ancho del paño(m)</label>
                <input type="number" id="ancho" name="Ancho" placeholder="Ej: 2,5" step="0.01" required>
            </div>
            <button type="submit" class="btn-calcular">Calcular</button>
        </form>
    </main>

    <div class="calc-container" id="vista-resultado" style="display: none;">
        <h1>Resultado</h1>
        <h2 id="resultado-titulo">Paño 4x3 (m) e = 0,1</h2>

        <div class="resultado-grid">
            <div class="resultado-card">
                <span class="resultado-label">Superficie Base</span>
                <span class="resultado-valor" id="valor-superficie">--</span>
            </div>

            <div class="resultado-card">
                <span class="resultado-label">+ Con 10% extra</span>
                <span class="resultado-valor" id="valor-extra">--</span>
            </div>
        </div>
        <button class="btn-calcular" onclick="window.location.href='menu.html'">Volver al menu</button>
    </div>


</body>

</html>
