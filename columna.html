<!DOCTYPE html>

<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, user-scalable=1.0, initial-scale=1.0, maximum-scalable=1.0, minimum-scalable=1.0">
    <meta http-equiv="X-UA-compatible" content="IE-edge">
    <title>columna- Calculadora de Materiales</title>
    <meta name="description" content="Calcular todo tipo de materiale">
    <meta name="author" content="JHON ANDERSON MANTILLA">
    <link rel="shortcut icon" href="google.png.svg">
    <link rel="stylesheet" href="style.css">
    <script src="calculadora.js" defer></script>

</head>

<body>
    <img class="logo" src="logo.png" alt="Manteriales">
    <main class="calc-container" id="vista-formulario">
        <h1>Calcular columna</h1>

        <form id="form-columna">
            <div class="input-group">
                <label for="Largo">Largo de la columna (m)</label>
                <input type="number" id="largo" name="lago" placeholder="ej: 3" step="0.01" required>
            </div>
            <button type="submit" class="btn-calcular">Calcular</button>
        </form>
    </main>

    <div class="calc-container" id="vista-resultado" style="display: none;">
        <h1>Resultado</h1>
        <h2 id="resultado-titulo">Columna de 3 (m)</h2>

        <div class="resultado-grid">
            <div class="resultado-card">
                <span class="resultado-label">Piedra m³</span>
                <span class="resultado-valor" id="valor-piedra">--</span>
            </div>

            <div class="resultado-card">
                <span class="resultado-label">cemento</span>
                <span class="resultado-valor" id="valor-cemento">--</span>
            </div>

            <div class="resultado-card">
                <span class="resultado-label">Arena</span>
                <span class="resultado-valor" id="valor-arena">--</span>
            </div>
            <div class="resultado-card">
                <span class="resultado-label">Hierro10</span>
                <span class="resultado-valor" id="valor-hierro10">--</span>
            </div>

            <div class="resultado-card">
                <span class="resultado-label">Hierro4</span>
                <span class="resultado-valor" id="valor-hierro4">--</span>
            </div>

            <button class="btn-volver" onclick="window.location.href='menu.html'">Volver al menu</button>
        </div>
</body>

</html>
